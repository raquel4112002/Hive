# Hive modification: models for the optional LiteLLM profile.
# Derived from Rakazo (Apache License 2.0).
# Add another model as a second entry. Without model_info prices, spend stays at zero
# and a monthly budget does not run out.

model_list:
  - model_name: os.environ/HIVE_DEFAULT_MODEL
    litellm_params:
      model: os.environ/LITELLM_MODEL
      api_base: os.environ/LITELLM_API_BASE

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
