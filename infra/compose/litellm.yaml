# Hive modification: models for the optional LiteLLM profile.
# Derived from Rakazo (Apache License 2.0).
# Add another model as a second entry. Local models are priced at zero, so a
# monthly budget does not run out until these two prices are set above zero.

model_list:
  - model_name: os.environ/HIVE_DEFAULT_MODEL
    litellm_params:
      model: os.environ/LITELLM_MODEL
      api_base: os.environ/LITELLM_API_BASE
    model_info:
      input_cost_per_token: 0
      output_cost_per_token: 0

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
